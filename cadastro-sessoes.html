<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Sessões</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Cadastro de Sessões 🎟️</h2>
    <form id="formSessao">
      <div class="mb-3">
        <label class="form-label">Filme</label>
        <select class="form-select" id="filmeId" required></select>
      </div>
      <div class="mb-3">
        <label class="form-label">Sala</label>
        <select class="form-select" id="salaId" required></select>
      </div>
      <div class="mb-3">
        <label class="form-label">Data e Hora</label>
        <input type="datetime-local" class="form-control" id="dataHora" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Preço (R$)</label>
        <input type="number" step="0.01" class="form-control" id="preco" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Idioma</label>
        <select class="form-select" id="idioma" required>
          <option value="">Selecione</option>
          <option>Dublado</option><option>Legendado</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Formato</label>
        <select class="form-select" id="formato" required>
          <option value="">Selecione</option>
          <option>2D</option><option>3D</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Sessão</button>
    </form>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function carregarDados() {
      const [filmesRes, salasRes] = await Promise.all([
        fetch(`${API}/filmes`),
        fetch(`${API}/salas`),
      ]);
      const filmes = await filmesRes.json();
      const salas = await salasRes.json();

      const selFilme = document.getElementById('filmeId');
      const selSala = document.getElementById('salaId');
      selFilme.innerHTML = "<option value=''>Selecione um filme</option>";
      selSala.innerHTML = "<option value=''>Selecione uma sala</option>";

      filmes.forEach(f => {
        selFilme.innerHTML += `<option value="${f.id}">${f.titulo}</option>`;
      });
      salas.forEach(s => {
        selSala.innerHTML += `<option value="${s.id}">${s.nome} (${s.tipo})</option>`;
      });
    }

    document.getElementById('formSessao').addEventListener('submit', async function(e) {
      e.preventDefault();
      const body = {
        filmeId: Number(document.getElementById('filmeId').value),
        salaId: Number(document.getElementById('salaId').value),
        dataHora: document.getElementById('dataHora').value,
        preco: Number(document.getElementById('preco').value),
        idioma: document.getElementById('idioma').value,
        formato: document.getElementById('formato').value,
      };
      const res = await fetch(`${API}/sessoes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        alert('Sessão cadastrada com sucesso!');
        this.reset();
      } else {
        alert('Erro ao cadastrar sessão.');
      }
    });

    carregarDados();
  </script>
</body>
</html>
