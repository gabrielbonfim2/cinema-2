<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Venda de Ingressos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Venda de Ingressos 💳</h2>
    <form id="formIngresso">
      <div class="mb-3">
        <label class="form-label">Sessão</label>
        <select class="form-select" id="sessaoId" required></select>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome do Cliente</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label">CPF</label>
        <input type="text" class="form-control" id="cpf" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Assento</label>
        <input type="text" class="form-control" id="assento" placeholder="Ex: A10" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo de Pagamento</label>
        <select class="form-select" id="pagamento" required>
          <option value="">Selecione</option>
          <option>Cartão</option><option>Pix</option><option>Dinheiro</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Confirmar Venda</button>
    </form>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function carregarSessoes() {
      const res = await fetch(`${API}/sessoes`);
      const sessoes = await res.json();
      const select = document.getElementById('sessaoId');
      select.innerHTML = "<option value=''>Selecione uma sessão</option>";
      sessoes.forEach(s => {
        select.innerHTML += `<option value="${s.id}">${s.filme.titulo} - ${s.dataHora}</option>`;
      });

      // Pré-seleciona se veio da página de sessões
      const params = new URLSearchParams(window.location.search);
      const sessaoId = params.get('sessaoId');
      if (sessaoId) select.value = sessaoId;
    }

    document.getElementById('formIngresso').addEventListener('submit', async function(e) {
      e.preventDefault();
      const body = {
        sessaoId: Number(document.getElementById('sessaoId').value),
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value,
        assento: document.getElementById('assento').value,
        pagamento: document.getElementById('pagamento').value,
      };
      const res = await fetch(`${API}/ingressos`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        alert('Ingresso vendido com sucesso!');
        this.reset();
      } else {
        alert('Erro ao registrar ingresso.');
      }
    });

    carregarSessoes();
  </script>
</body>
</html>
