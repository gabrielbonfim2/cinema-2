<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Salas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Cadastro de Salas 🏢</h2>
    <form id="formSala">
      <div class="mb-3">
        <label class="form-label">Nome da Sala</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Capacidade</label>
        <input type="number" class="form-control" id="capacidade" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="tipo" required>
          <option value="">Selecione</option>
          <option>2D</option><option>3D</option><option>IMAX</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Sala</button>
    </form>

    <h3 class="mt-5">Salas Cadastradas 🏢</h3>
    <table class="table table-striped mt-2">
      <thead>
        <tr><th>Nome</th><th>Capacidade</th><th>Tipo</th><th>Ações</th></tr>
      </thead>
      <tbody id="listaSalas"></tbody>
    </table>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function carregarSalas() {
      try {
        const res = await fetch(`${API}/salas`);
        const salas = await res.json();
        const tabela = document.getElementById('listaSalas');
        tabela.innerHTML = '';
        if (salas.length === 0) {
          tabela.innerHTML = "<tr><td colspan='4'>Nenhuma sala cadastrada</td></tr>";
          return;
        }
        salas.forEach(sala => {
          tabela.innerHTML += `
            <tr>
              <td>${sala.nome}</td>
              <td>${sala.capacidade}</td>
              <td>${sala.tipo}</td>
              <td><button class="btn btn-danger btn-sm" onclick="excluirSala(${sala.id})">Excluir</button></td>
            </tr>`;
        });
      } catch (e) {
        alert('Erro ao conectar com a API.');
      }
    }

    async function excluirSala(id) {
      if (!confirm('Excluir esta sala?')) return;
      await fetch(`${API}/salas/${id}`, { method: 'DELETE' });
      carregarSalas();
    }

    document.getElementById('formSala').addEventListener('submit', async function(e) {
      e.preventDefault();
      const body = {
        nome: document.getElementById('nome').value,
        capacidade: Number(document.getElementById('capacidade').value),
        tipo: document.getElementById('tipo').value,
      };
      const res = await fetch(`${API}/salas`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        alert('Sala cadastrada com sucesso!');
        this.reset();
        carregarSalas();
      } else {
        alert('Erro ao cadastrar sala.');
      }
    });

    carregarSalas();
  </script>
</body>
</html>
