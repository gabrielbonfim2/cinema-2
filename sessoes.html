<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sessões Disponíveis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Sessões Disponíveis 🎟️</h2>
    <div id="listaSessoes" class="row"></div>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function carregarSessoes() {
      try {
        const res = await fetch(`${API}/sessoes`);
        const sessoes = await res.json();
        const container = document.getElementById('listaSessoes');
        container.innerHTML = '';
        if (sessoes.length === 0) {
          container.innerHTML = '<p>Nenhuma sessão cadastrada.</p>';
          return;
        }
        sessoes.forEach(sessao => {
          const card = document.createElement('div');
          card.className = 'col-md-4';
          card.innerHTML = `
            <div class="card mb-4">
              <div class="card-body">
                <h5 class="card-title">${sessao.filme.titulo}</h5>
                <p><strong>Sala:</strong> ${sessao.sala.nome}</p>
                <p><strong>Data:</strong> ${sessao.dataHora}</p>
                <p><strong>Idioma:</strong> ${sessao.idioma} | ${sessao.formato}</p>
                <p><strong>Preço:</strong> R$ ${Number(sessao.preco).toFixed(2)}</p>
                <a href="venda-ingressos.html?sessaoId=${sessao.id}" class="btn btn-success">
                  Comprar Ingresso
                </a>
              </div>
            </div>`;
          container.appendChild(card);
        });
      } catch (e) {
        document.getElementById('listaSessoes').innerHTML = '<p class="text-danger">Erro ao conectar com a API.</p>';
      }
    }

    carregarSessoes();
  </script>
</body>
</html>
