<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Filmes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎬 Cinema RapiDEX</a>
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Ingressos</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listagem</a></li>
      </ul>
    </div>
  </nav>

  <div class="container mt-5">
    <h2 class="mb-4">Cadastro de Filmes 🎥</h2>

    <form id="formFilme">
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" class="form-control" id="titulo" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Gênero</label>
        <input type="text" class="form-control" id="genero" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Descrição</label>
        <textarea class="form-control" id="descricao" required></textarea>
      </div>
      <div class="mb-3">
        <label class="form-label">Classificação Indicativa</label>
        <select class="form-select" id="classificacao" required>
          <option value="">Selecione</option>
          <option>Livre</option><option>10+</option><option>12+</option>
          <option>14+</option><option>16+</option><option>18+</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Duração (minutos)</label>
        <input type="number" class="form-control" id="duracao" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Data de Estreia</label>
        <input type="date" class="form-control" id="dataEstreia" required>
      </div>
      <button type="submit" class="btn btn-primary">Salvar Filme</button>
    </form>

    <h3 class="mt-5">Filmes Cadastrados 🎬</h3>
    <div id="loading" class="text-muted">Carregando...</div>
    <table class="table table-striped mt-2">
      <thead>
        <tr><th>Título</th><th>Gênero</th><th>Duração</th><th>Classificação</th><th>Ações</th></tr>
      </thead>
      <tbody id="listaFilmes"></tbody>
    </table>
  </div>

  <script>
    const API = 'http://localhost:3000';

    async function carregarFilmes() {
      try {
        const res = await fetch(`${API}/filmes`);
        const filmes = await res.json();
        const tabela = document.getElementById('listaFilmes');
        document.getElementById('loading').style.display = 'none';
        tabela.innerHTML = '';
        if (filmes.length === 0) {
          tabela.innerHTML = "<tr><td colspan='5'>Nenhum filme cadastrado</td></tr>";
          return;
        }
        filmes.forEach(filme => {
          tabela.innerHTML += `
            <tr>
              <td>${filme.titulo}</td>
              <td>${filme.genero}</td>
              <td>${filme.duracao} min</td>
              <td>${filme.classificacao}</td>
              <td><button class="btn btn-danger btn-sm" onclick="excluirFilme(${filme.id})">Excluir</button></td>
            </tr>`;
        });
      } catch (e) {
        document.getElementById('loading').textContent = '❌ Erro ao conectar com a API. Verifique se o servidor está rodando.';
      }
    }

    async function excluirFilme(id) {
      if (!confirm('Tem certeza que deseja excluir este filme?')) return;
      await fetch(`${API}/filmes/${id}`, { method: 'DELETE' });
      carregarFilmes();
    }

    document.getElementById('formFilme').addEventListener('submit', async function(e) {
      e.preventDefault();
      const body = {
        titulo: document.getElementById('titulo').value,
        genero: document.getElementById('genero').value,
        descricao: document.getElementById('descricao').value,
        classificacao: document.getElementById('classificacao').value,
        duracao: Number(document.getElementById('duracao').value),
        dataEstreia: document.getElementById('dataEstreia').value,
      };
      const res = await fetch(`${API}/filmes`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (res.ok) {
        alert('Filme cadastrado com sucesso!');
        this.reset();
        carregarFilmes();
      } else {
        alert('Erro ao cadastrar filme.');
      }
    });

    carregarFilmes();
  </script>
</body>
</html>
